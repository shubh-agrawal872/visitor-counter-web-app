apiVersion: apps/v1
kind: Deployment
metadata:
  name: visitor-counter-backup
spec:
  replicas: 2
  selector:
    matchLabels:
      app: visitor-backup
  template:
    metadata:
      labels:
        app: visitor-backup
    spec:
      containers:
      - name: visitor-counter
        image: visitor-counter:1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        env:
        - name: REDIS_HOST
          value: redis
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
